<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>MOPS 公開資訊觀測站｜重大資訊查詢</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Google 可搜尋（不影響畫面） -->
  <meta name="description" content="胖虎萱給慶慶的生日驚喜">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "PingFang TC", "Microsoft JhengHei",
        system-ui, sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    header {
      background: linear-gradient(180deg, #0b3c8a, #092f6e);
      color: white;
      padding: 16px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.03em;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid #d1d6e0;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .hint {
      font-size: 0.9rem;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      box-sizing: border-box;
      margin-top: 6px;
    }

    button {
      margin-top: 14px;
      background: #0b3c8a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 0.95rem;
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    #result {
      display: none;
      margin-top: 28px;
    }

    .reveal-box {
      max-width: 680px;
      margin: 0 auto;
      padding: 22px 24px;
      background: #ffffff;
      border: 1px solid #d1d6e0;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      white-space: pre-wrap;
      line-height: 1.9;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

<!-- ✅ Google 關鍵字（隱藏） -->
<div style="display:none;">胖虎萱給慶慶的生日驚喜</div>

<header>
  <h1>MOPS 公開資訊觀測站</h1>
  <p>Market Observation Post System</p>
</header>

<main>
  <div class="panel">
    <h2>重大資訊查詢</h2>

    <p class="hint">
      請輸入公司代碼以查詢相關重大資訊。<br>
      本系統資料屬特殊情境揭露內容，<br>
      僅限特定對象於指定時間查閱。
    </p>

    <input id="codeInput" placeholder="請輸入欲查詢之股票代碼">
    <button onclick="search()">查詢</button>

    <div id="result">
      <div class="reveal-box" id="revealText"></div>
    </div>
  </div>
</main>

<script>
function search() {
  const code = document.getElementById("codeInput").value.trim();
  const box = document.getElementById("revealText");
  const result = document.getElementById("result");
  box.textContent = "";
  result.style.display = "block";

  const texts = {
    "1210": `【資訊揭露程序完成】

經系統驗證確認，
本次查詢關鍵字正確，
揭露程序已完成。

本頁面僅作為身分驗證用途，
未包含最終結論。

—

接下來的內容，
已不再屬於公開資訊，
而是為特定對象所保留。

請依卡片指示，
關閉瀏覽器並前往下一頁繼續閱讀。`,

    "7610": `公司名稱：聯友金屬股份有限公司
產業別：金屬製品業

備註：
本公司不屬於本系統既定揭露標的，
僅作為附加比對用途。

惟依近期營運條件與產業觀察，
後續仍具持續成長與上行潛力，
屬可長期觀察之標的。`,

    "2891": `公司名稱：中國信託金融控股股份有限公司
產業別：金融保險業

提醒：
本資料僅供系統測試與附加顯示用途，
本查詢系統核心揭露內容，
仍為特定生日重大資訊。`
  };

  if (!texts[code]) {
    box.textContent = "查無相關重大資訊，請確認代碼是否正確。";
    return;
  }

  typeText(texts[code], 0);
}

function typeText(text, i) {
  const box = document.getElementById("revealText");
  if (i < text.length) {
    box.textContent += text[i];
    const ch = text[i];
    setTimeout(() => typeText(text, i + 1), "，。、…\n".includes(ch) ? 160 : 40);
  }
}
</script>

</body>
</html>
