<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>公開資訊觀測站｜重大資訊查詢</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Google 搜尋描述 -->
  <meta name="description" content="胖虎萱給慶慶的生日驚喜">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "PingFang TC", "Microsoft JhengHei",
                   system-ui, sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    header {
      background: linear-gradient(180deg, #0b3c8a, #092f6e);
      color: white;
      padding: 16px 28px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    main {
      max-width: 1000px;
      margin: 36px auto;
      padding: 0 24px;
    }

    .panel {
      background: white;
      border: 1px solid #d1d6e0;
      border-radius: 6px;
      padding: 24px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
    }

    .hint-block p {
      font-size: 0.9rem;
      color: #374151;
      margin: 4px 0;
      line-height: 1.7;
    }

    #searchArea {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    #codeInput {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      background: #0b3c8a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    button:hover {
      background: #0a357a;
    }

    #result {
      display: none;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px dashed #c7cdd9;
      white-space: pre-wrap;
      line-height: 1.75;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

<!-- ✅ Google 搜尋關鍵字（不顯示在畫面） -->
<div style="display:none;">
胖虎萱給慶慶的生日驚喜
</div>

<header>
  <h1>MOPS 公開資訊觀測站</h1>
  <p>Market Observation Post System</p>
</header>

<main>
  <div class="panel">
    <h2>重大資訊查詢</h2>

    <!-- ✅ 說明文字分兩段，比較工整 -->
    <div class="hint-block" id="intro">
      <p>本系統所揭露內容屬特殊情境之非公開資訊，僅限特定對象於指定時間查閱。</p>
      <p>請輸入公司代碼以查詢相關重大資訊，並完成通關驗證程序，以確認閱讀資格。</p>
    </div>

    <!-- ✅ 搜尋區塊，之後會被隱藏 -->
    <div id="searchArea">
      <input
        id="codeInput"
        placeholder="請輸入欲查詢之股票代碼"
      >
      <button onclick="search()">查詢</button>
    </div>

    <!-- ✅ 顯示結果的區塊 -->
    <div id="result"></div>
  </div>
</main>

<script>
const input = document.getElementById("codeInput");
const result = document.getElementById("result");
const searchArea = document.getElementById("searchArea");
const intro = document.getElementById("intro");

// 讓 Enter 也能查詢
input.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

function search() {
  const code = input.value.trim();
  if (!code) return;

  let message = "";

  if (code === "1210") {
    message =
`【資訊揭露程序完成】

經系統驗證確認，
本次驗證關鍵字正確，
揭露程序已完成。

本頁面僅作為身分確認用途，
未包含最終結論。

—

接下來的內容，
已不再屬於公開資訊，
而是為特定對象所保留。

請依卡片指示，
關閉瀏覽器並前往下一頁繼續閱讀。`;
  } else if (code === "7610") {
    message =
`公司名稱：聯友金屬股份有限公司
產業別：金屬製品業

備註：
本公司不屬於本系統之主要揭露標的，
僅供附加查詢用途。

補充說明：
後續營運表現仍有觀察空間，
股價走勢具潛在上漲機會。`;
  } else if (code === "2891") {
    message =
`公司名稱：中國信託金融控股股份有限公司
產業別：金融保險業

提醒：
本公司不屬於本系統之主要揭露標的，
僅供附加查詢用途。

本查詢系統的核心目的，
仍為特定生日重大揭露。`;
  } else {
    // 錯誤碼就不要轉場，用原本區塊＋一次顯示就好
    result.style.display = "block";
    result.textContent = "查無相關重大資訊，請確認代碼是否正確。";
    return;
  }

  // ✅ 轉頁感：把說明＋輸入區藏起來，只留下結果
  intro.style.display = "none";
  searchArea.style.display = "none";
  result.style.display = "block";

  // ✅ 打字機效果
  typeText(message, 0);
}

function typeText(text, i) {
  if (i === 0) result.textContent = "";

  if (i < text.length) {
    result.textContent += text[i];
    const ch = text[i];
    const delay = "，。、…\n".includes(ch) ? 160 : 40;
    setTimeout(() => typeText(text, i + 1), delay);
  }
}
</script>

</body>
</html>
